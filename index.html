const QUERY = "is_platform=true&group_id=13&course_id=126";
const tokenInput = document.getElementById("token");
tokenInput.value = localStorage.getItem("reviewToken") || "";
document.getElementById("save").onclick = () => {
  localStorage.setItem("reviewToken", tokenInput.value.trim());
};
document.getElementById("showAll").onchange = render;

function gameUrl(id) {
  return "https://edudev.med-game.ru/front/#/game/" + id + "?" + QUERY;
}

function render() {
  const showAll = document.getElementById("showAll").checked;
  const list = document.getElementById("list");
  list.innerHTML = "";
  const rank = { verified: 0, review: 1, open: 2 };
  const rows = TESTS.filter(t => showAll || t.status !== "open").slice().sort((a,b) => rank[a.status]-rank[b.status] || a.n-b.n);
  for (const t of rows) {
    const card = document.createElement("article");
    card.className = "card " + t.status;
    const badge = t.status === "verified" ? "проверено вручную" : t.status === "review" ? "ждёт проверки" : "не готово";
    card.innerHTML = "<h2>" + t.play + " · " + t.title + "<span class=\"badge\">" + badge + "</span></h2>"
      + "<div class=\"meta\">тест " + t.id + "</div>"
      + "<div class=\"note\">" + t.note + "</div>"
      + "<div class=\"url\">" + gameUrl(t.id) + "</div>";
    card.ondblclick = () => openTest(t, card);
    list.appendChild(card);
  }
}

let caseWindow = null;

function currentToken() {
  return (tokenInput.value || "").trim().replace(/^Bearer\s+/i, "");
}

function sendToken(target) {
  const token = currentToken();
  if (!token || !target) return;
  try { target.postMessage({ type: "token", token }, "*"); } catch (e) {}
}

window.addEventListener("message", (event) => {
  const type = event.data && event.data.type;
  if (type !== "SCENARIO_PLAYER_READY" && type !== "REQUEST_SCENARIO_PLAYER_TOKEN") return;
  sendToken(event.source);
});

function openTest(t, card) {
  document.querySelectorAll(".card").forEach(el => el.classList.remove("active"));
  card.classList.add("active");
  localStorage.setItem("reviewToken", currentToken());
  const url = gameUrl(t.id);
  const opened = window.open(url, "_blank");
  const placeholder = document.getElementById("placeholder");
  if (opened) {
    caseWindow = opened;
    [400, 1200, 2500, 5000].forEach((ms) => setTimeout(() => sendToken(opened), ms));
    placeholder.textContent = "Открыто " + t.play + ". Токен уходит в игру, когда она сообщит, что готова.";
    return;
  }
  const link = document.createElement("a");
  link.href = url;
  link.target = "_blank";
  link.rel = "opener";
  document.body.appendChild(link);
  link.click();
  link.remove();
  placeholder.textContent = "Открываю " + t.play + ". Если вкладка пишет «Ждём JWT», оставьте эту страницу открытой: токен уйдёт после сигнала готовности.";
}

render();
